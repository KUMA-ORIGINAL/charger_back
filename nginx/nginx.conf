upstream back {
    server backend:8000;
}

server {
    listen 80;
    server_name $DOMAIN www.$DOMAIN;
    charset utf-8;
    client_max_body_size 100M;
    server_tokens off;

    location /static/ {
        alias  /app/static/;
        expires 15d;
    }

    location /media/ {
        alias  /app/media/;
        expires 7d;
    }

    # React-админка (admin-ui): статика, собранная в образ nginx (см. Dockerfile).
    # Ходит в /api/staff/v1/ того же домена, поэтому CORS и токены не нужны,
    # а CSP строже, чем у остального сайта: никаких inline-скриптов и внешних доменов.
    location = /panel {
        return 301 /panel/;
    }

    location /panel/assets/ {
        root /usr/share/nginx;
        # Имена файлов содержат хеш — кэшируем навсегда.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /panel/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        # index.html всегда свежий, иначе после деплоя браузер просит старые ассеты.
        add_header Cache-Control "no-cache" always;
        root /usr/share/nginx;
        # Маршруты SPA (/panel/r/chargepoint/5) отдают index.html — дальше решает роутер.
        try_files $uri /panel/index.html;
    }

    location /admin/ {
        proxy_pass http://back/admin/;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://back/api/;  # Проксируем запросы на бэкенд для API
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    location /ws/ {
        proxy_pass http://back/ws/;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/docs/ {
        proxy_pass http://back/api/docs/;  # Проксируем запросы на бэкенд для API
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}
